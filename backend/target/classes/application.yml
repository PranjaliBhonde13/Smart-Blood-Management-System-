# ============================================================
# Smart Blood Emergency Network — application config
# Secrets come from environment variables (never commit real values).
# ============================================================
spring:
  application:
    name: smart-blood-emergency-network

  # Load backend/.env (KEY=VALUE) when present. Real environment variables still win.
  config:
    import: optional:file:.env[.properties]

  datasource:
    # Local MariaDB/MySQL database for development (create it with database/setup-database.ps1).
    url: jdbc:mariadb://${DB_HOST:localhost}:${DB_PORT:3309}/${DB_NAME:SBN}?useSSL=false&serverTimezone=UTC
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: org.mariadb.jdbc.Driver

  jpa:
    hibernate:
      # Flyway owns the schema; Hibernate must never alter it.
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        # Dialect is auto-detected correctly via the MariaDB driver.
    open-in-view: false
    show-sql: false

  # Medical reports up to 5 MB (FileStorageService enforces the same limit).
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  # ----- Mail: SMTP (Gmail by default; any provider via MAIL_HOST/MAIL_PORT) -----
  # Credentials come ONLY from the environment / backend/.env — never commit them here.
  # For Gmail, MAIL_PASSWORD must be a Google app password, not the account password.
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
      mail.smtp.ssl.trust: ${MAIL_HOST:smtp.gmail.com}
      # Never let a slow mail server hang a sending thread.
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 15000
      mail.smtp.writetimeout: 15000

server:
  port: 8080
  # Trust X-Forwarded-* from the nginx reverse proxy so the real client IP is
  # used for rate limiting and audit logs.
  forward-headers-strategy: native
  servlet:
    context-path: /

# OpenAPI / Swagger
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

# Actuator health at /actuator/health
management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    # An SMTP login probe must not mark the whole API DOWN (and must not run at
    # all when mail is disabled). Mail failures are logged per send instead.
    mail:
      enabled: false

# ----- Application-specific settings -----
app:
  # Base64 256-bit dev secret. OVERRIDE with env JWT_SECRET in production.
  jwt:
    secret: ${JWT_SECRET:c21hcnQtYmxvb2QtZW1lcmdlbmN5LW5ldHdvcmstZGV2LXNlY3JldC1rZXktMjAyNi1jaGFuZ2VtZQ==}
    access-expiration-ms: ${JWT_ACCESS_MS:900000}      # 15 minutes
    refresh-expiration-ms: ${JWT_REFRESH_MS:604800000} # 7 days
  otp:
    expiration-minutes: 10
    length: 6
  # Public address of the web app, used for links in emails.
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  mail:
    # Gmail only sends as the signed-in account (or a verified alias).
    from: "${MAIL_FROM:Smart Blood Emergency Network <no-reply@localhost>}"
    app-name: Smart Blood Emergency Network
    # Never emailed (recorded as SUPPRESSED): test domains and the demo @sben.com accounts.
    suppressed-domains: ${MAIL_SUPPRESSED_DOMAINS:example.com,example.org,example.net,example.test,sben.com}
    # Stay within the provider's limits (Gmail: about 500 recipients/day). Over a cap, emails wait.
    max-per-minute: ${MAIL_MAX_PER_MINUTE:20}
    max-per-day: ${MAIL_MAX_PER_DAY:450}
    max-attempts: ${MAIL_MAX_ATTEMPTS:6}
    dispatch-interval-ms: ${MAIL_DISPATCH_INTERVAL_MS:15000}
    # Delivered emails are deleted after this many days; failed ones are kept for review.
    retention-days: ${MAIL_RETENTION_DAYS:90}
  # false = emails are logged to the console instead of sent (local development).
  mail-enabled: ${MAIL_ENABLED:false}
  admin:
    # Real administrator accounts, created at startup if missing (comma-separated).
    # They set their password via "Forgot password"; no password is ever configured.
    emails: ${ADMIN_EMAILS:}
  # Create the demo accounts (password Pass@123) when they are missing. Existing
  # accounts are never modified. Set SEED_DEMO_USERS=false in production.
  seed-demo-users: ${SEED_DEMO_USERS:true}
  # Hospital documents & verification. Which documents are required is stored
  # in the hospital_document_requirements table (editable by admins).
  hospital-documents:
    # Keep at or below spring.servlet.multipart.max-file-size.
    max-file-size: ${HOSPITAL_DOC_MAX_FILE_SIZE:5MB}
    expiry-warning-days: ${HOSPITAL_DOC_EXPIRY_WARNING_DAYS:30}
    # Nightly: mark expired documents and send expiry notifications.
    expiry-cron: "${HOSPITAL_DOC_EXPIRY_CRON:0 15 1 * * *}"
    # Optional ISO date (e.g. 2026-12-31). Until then, hospitals verified before
    # documents were introduced stay active while their mandatory documents are
    # missing or under review. Blank = no transition window.
    legacy-grace-until: ${HOSPITAL_DOCS_GRACE_UNTIL:}

logging:
  level:
    com.sben: INFO
    org.flywaydb: INFO
