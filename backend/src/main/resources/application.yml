# ============================================================
# Smart Blood Emergency Network — application config
# Secrets come from environment variables (never commit real values).
# ============================================================
spring:
  application:
    name: smart-blood-emergency-network

  # Load backend/.env (KEY=VALUE) when present. Real environment variables still win.
  config:
    import: optional:file:.env[.properties]

  datasource:
    # Local MariaDB/MySQL database for development (create it with database/setup-database.ps1).
    url: jdbc:mariadb://${DB_HOST:localhost}:${DB_PORT:3309}/${DB_NAME:SBN}?useSSL=false&serverTimezone=UTC
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: org.mariadb.jdbc.Driver

  jpa:
    hibernate:
      # Flyway owns the schema; Hibernate must never alter it.
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        # Dialect is auto-detected correctly via the MariaDB driver.
    open-in-view: false
    show-sql: false

  # Medical reports up to 5 MB (FileStorageService enforces the same limit).
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  # ----- Mail: Brevo SMTP for real OTP emails -----
  mail:
    host: ${MAIL_HOST:smtp-relay.brevo.com}
    port: ${MAIL_PORT:587}
    # Credentials come ONLY from the environment / backend/.env — never commit them here.
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
      mail.smtp.ssl.trust: smtp-relay.brevo.com

server:
  port: 8080
  # Trust X-Forwarded-* from the nginx reverse proxy so the real client IP is
  # used for rate limiting and audit logs.
  forward-headers-strategy: native
  servlet:
    context-path: /

# OpenAPI / Swagger
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

# Actuator health at /actuator/health
management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    # An SMTP login probe must not mark the whole API DOWN (and must not run at
    # all when mail is disabled). Mail failures are logged per send instead.
    mail:
      enabled: false

